<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Editar Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-light border-bottom mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Editar Cadastro</span>
        <div>
            <a class="btn btn-link" href="/pessoa">Voltar para lista</a>
            <a class="btn btn-link" href="/projeto">Cadastrar Projeto</a>
            <a class="btn btn-link" href="/script.js">Sair</a>
        </div>
    </div>
</nav>

<div class="container">
    <form th:action="@{/pessoa/{id}(id=${pessoa.id})}" method="post" class="w-50 mx-auto">
        <input type="hidden" name="_method" value="put">

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" class="form-control" id="nome" name="nome"
                           th:value="${pessoa.nome}" required maxlength="250">
                </div>

                <div class="mb-3">
                    <label for="idade" class="form-label">Idade: (min 17 max 100)</label>
                    <input type="number" class="form-control" id="idade" name="idade"
                           th:value="${pessoa.idade}" required min="17" max="100">
                </div>

                <div class="mb-3">
                    <label for="dataInicio" class="form-label">Data Início Curso: (dd/mm/yyyy)</label>
                    <input type="date" class="form-control" id="dataInicio" name="dataInicio"
                           th:value="${pessoa.dataInicio}" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Atualizar</button>
                    <a th:href="@{/pessoa}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
