<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lista de Pessoas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-light border-bottom mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Lista de Pessoas</span>
        <div>
            <a class="btn btn-link" href="/pessoa/new">Cadastrar Pessoa</a>
            <a class="btn btn-link" href="/projeto">Cadastrar Projeto</a>
            <a class="btn btn-link" href="/script.js">Sair</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Data Início</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pessoa : ${pessoas}">
                    <td th:text="${pessoa.id}"></td>
                    <td th:text="${pessoa.nome}"></td>
                    <td th:text="${pessoa.idade}"></td>
                    <td th:text="${pessoa.dataInicio}"></td>
                    <td>
                        <a th:href="@{/pessoa/{id}(id=${pessoa.id})}" class="btn btn-sm btn-outline-primary">Ver</a>
                        <a th:href="@{/pessoa/{id}/edit(id=${pessoa.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                        <form th:action="@{/pessoa/{id}/delete(id=${pessoa.id})}" method="post" style="display: inline;">
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
