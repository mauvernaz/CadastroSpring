<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Detalhes da Pessoa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-light border-bottom mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Detalhes da Pessoa</span>
        <div>
            <a class="btn btn-link" href="/pessoa">Voltar para lista</a>
            <a class="btn btn-link" href="/projeto">Cadastrar Projeto</a>
            <a class="btn btn-link" href="/script.js">Sair</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm w-50 mx-auto">
        <div class="card-body">
            <div th:if="${pessoa == null}" class="alert alert-warning">
                Pessoa não encontrada
            </div>

            <div th:if="${pessoa != null}">
                <h4 class="card-title mb-4">Informações Cadastrais</h4>

                <div class="mb-3">
                    <label class="form-label fw-bold">ID:</label>
                    <p th:text="${pessoa.id}" class="form-control-plaintext"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nome:</label>
                    <p th:text="${pessoa.nome}" class="form-control-plaintext"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Idade:</label>
                    <p th:text="${pessoa.idade}" class="form-control-plaintext"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Data de Início:</label>
                    <p th:text="${pessoa.dataInicio}" class="form-control-plaintext"></p>
                </div>

                <div class="d-flex gap-2">
                    <a th:href="@{/pessoa/{id}/edit(id=${pessoa.id})}" class="btn btn-primary">Editar</a>
                    <a th:href="@{/pessoa}" class="btn btn-outline-secondary">Voltar</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
